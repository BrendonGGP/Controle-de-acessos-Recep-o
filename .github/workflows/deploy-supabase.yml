name: Deploy Supabase

# Publica migrations e Edge Functions no projeto Supabase.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN   token de acesso pessoal (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    ref do projeto
#   SUPABASE_DB_PASSWORD    senha do banco (usada pelo db push)
#
# O environment "production" permite exigir aprovacao manual antes do
# deploy — configure em Settings > Environments.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
    inputs:
      deploy_migrations:
        description: 'Aplicar migrations no banco'
        type: boolean
        default: true
      deploy_functions:
        description: 'Publicar Edge Functions'
        type: boolean
        default: true

# Nunca roda dois deploys ao mesmo tempo; e nao cancela um deploy em andamento
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations e Functions
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Conferir se os secrets estao configurados
        run: |
          faltando=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || faltando="$faltando SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || faltando="$faltando SUPABASE_DB_PASSWORD"
          [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ] || faltando="$faltando SUPABASE_PROJECT_REF"

          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando"
            echo "Cadastre em Settings > Secrets and variables > Actions."
            echo "Passo a passo em docs/5_CONFIGURACAO_DEPLOY.md"
            exit 1
          fi
          echo "Os tres secrets estao presentes."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular ao projeto
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Migrations pendentes (dry run)
        run: supabase db push --dry-run

      - name: Aplicar migrations
        if: github.event_name == 'push' || inputs.deploy_migrations
        run: supabase db push --yes

      - name: Publicar Edge Functions
        if: github.event_name == 'push' || inputs.deploy_functions
        run: supabase functions deploy

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy Supabase"
            echo ""
            echo "- Projeto: \`${{ secrets.SUPABASE_PROJECT_REF }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
