name: Automacao de PR

# Usa `pull_request` (nao `pull_request_target`): nenhum job aqui executa
# codigo do PR, e pull_request_target daria acesso a secrets a partir de
# forks — risco desnecessario.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Rotular por area
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar labels conforme os arquivos alterados
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

  titulo:
    name: Validar titulo (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checar prefixo do titulo
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            O titulo do PR deve comecar com letra minuscula depois do prefixo.
            Ex: "fix: corrige recursao no RLS" (nao "fix: Corrige...")

  tamanho:
    name: Rotular por tamanho
    runs-on: ubuntu-latest
    steps:
      - name: Calcular e aplicar label de tamanho
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const changes = pr.additions + pr.deletions

            const sizes = [
              { max: 10,   label: 'size/XS' },
              { max: 100,  label: 'size/S'  },
              { max: 500,  label: 'size/M'  },
              { max: 1000, label: 'size/L'  },
              { max: Infinity, label: 'size/XL' },
            ]
            const target = sizes.find(s => changes <= s.max).label
            const all = sizes.map(s => s.label)

            const current = pr.labels.map(l => l.name)

            // Remove labels de tamanho antigos que nao sejam o correto
            for (const label of current.filter(l => all.includes(l) && l !== target)) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: pr.number,
                name: label,
              }).catch(() => {})
            }

            if (!current.includes(target)) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: [target],
              })
            }

            core.info(`${changes} linhas alteradas -> ${target}`)
