name: Atualizar Documentacao PDF

# Gera o PDF da documentacao e o publica como artefato do workflow e
# como asset da release "docs-latest".
#
# Antes este workflow commitava o PDF de volta no main. Isso parou de
# funcionar quando a branch passou a exigir status checks: um push de
# bot nao dispara os checks, entao a protecao rejeita o commit
# (GH006: Protected branch update failed).
#
# Publicar como release asset e melhor de qualquer forma: o PDF e um
# artefato gerado, e versiona-lo suja o historico com diffs binarios a
# cada alteracao na documentacao.

on:
  push:
    paths:
      - 'docs/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pdf
  cancel-in-progress: true

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup TeX
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-recommended texlive-xetex texlive-fonts-recommended texlive-fonts-extra

      - name: Gerar PDF das Documentacoes
        run: |
          # Ordem numerica dos arquivos; inclui automaticamente novos docs
          cat $(ls docs/[0-9]*.md | sort -V) > docs/FULL.md
          pandoc docs/FULL.md -o Documentacao_Tecnica_GGP.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=1in \
            -V lang=pt-BR \
            --toc
          rm docs/FULL.md

      - name: Publicar como artefato do workflow
        uses: actions/upload-artifact@v7
        with:
          name: documentacao-pdf
          path: Documentacao_Tecnica_GGP.pdf
          retention-days: 90

      - name: Publicar na release docs-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docs-latest
          name: Documentacao Tecnica (ultima versao)
          body: |
            PDF gerado automaticamente a partir de `docs/` no commit ${{ github.sha }}.

            Atualizado em cada alteracao da documentacao no branch main.
          files: Documentacao_Tecnica_GGP.pdf
          make_latest: false

      - name: Resumo
        run: |
          {
            echo "### Documentacao em PDF"
            echo ""
            echo "Gerada a partir de:"
            ls docs/[0-9]*.md | sort -V | sed 's/^/- /'
            echo ""
            echo "Disponivel em **Artifacts** acima e na release \`docs-latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
