version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      # Agrupa atualizacoes de patch/minor num PR so, para nao poluir o repo
      dependencias-menores:
        update-types: [minor, patch]
    labels:
      - dependencias
      - frontend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Sao_Paulo
    commit-message:
      prefix: 'ci'
    labels:
      - dependencias
      - ci/cd
